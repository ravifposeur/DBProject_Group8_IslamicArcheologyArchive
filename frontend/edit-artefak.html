<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Objek</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
    <nav><a href="index.html">Kembali</a></nav>
    <main class="form-container">
        <h2>Edit Objek</h2>
        <form id="form-edit-artefact">
            <div class="form-group">
                <label>Lokasi Situs</label>
                <select id="situs_id" required><option value="">Memuat...</option></select>
            </div>
            <input type="text" id="nama_objek" required placeholder="Nama Objek">
            
            <div class="row">
                <input type="text" id="jenis_objek" required placeholder="Jenis">
                <input type="text" id="bahan" required placeholder="Bahan">
            </div>
            <h3>Dimensi</h3>
            <div class="row">
                <input type="number" id="panjang" step="any" required placeholder="P">
                <input type="number" id="lebar" step="any" required placeholder="L">
                <input type="number" id="tinggi" step="any" required placeholder="T">
            </div>
            <h3>Detail Teks (Opsional)</h3>
            <input type="text" id="aksara" placeholder="Aksara">
            <input type="text" id="bahasa" placeholder="Bahasa">
            <textarea id="teks_transliterasi" placeholder="Transliterasi" style="width:100%; margin-top:5px;"></textarea>
            <button type="submit" style="margin-top:15px;">Update Objek</button>
        </form>
    </main>
    <script type="module" src="modules/main.js"></script>
</body>
</html>
