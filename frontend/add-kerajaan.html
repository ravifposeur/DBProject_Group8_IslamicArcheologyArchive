<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tambah Kerajaan</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
    <nav><a href="kerajaan.html">Kembali</a></nav>
    <main class="form-container">
        <h2>Tambah Kerajaan</h2>
        <form id="form-add-kingdom">
            <input type="text" id="nama_kerajaan" required placeholder="Nama Kerajaan">
            <input type="text" id="pusat_pemerintahan" placeholder="Pusat Pemerintahan">
            <div class="row">
                <input type="number" id="tahun_berdiri" placeholder="Tahun Berdiri">
                <input type="number" id="tahun_runtuh" placeholder="Tahun Runtuh">
            </div>
            <textarea id="deskripsi_singkat" required placeholder="Deskripsi" style="width:100%; padding:10px; margin-bottom:10px;"></textarea>
            <button type="submit">Simpan</button>
        </form>
    </main>
    <script type="module" src="modules/main.js"></script>
</body>
</html>
