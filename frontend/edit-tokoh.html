<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Edit Tokoh</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/components.css"></head>
<body>
    <nav><a href="tokoh.html">Kembali</a></nav>
    <main class="form-container">
        <h2>Edit Tokoh</h2>
        <form id="form-edit-tokoh">
            <input type="text" id="nama_tokoh" required placeholder="Nama Tokoh">
            <select id="kerajaan_id"><option value="">Memuat...</option></select>
            <div class="row">
                <input type="number" id="tahun_lahir" placeholder="Tahun Lahir">
                <input type="number" id="tahun_wafat" placeholder="Tahun Wafat">
            </div>
            <input type="text" id="biografi_singkat" required placeholder="Biografi">
            <button type="submit">Update</button>
        </form>
    </main>
    <script type="module" src="modules/main.js"></script>
</body>
</html>
