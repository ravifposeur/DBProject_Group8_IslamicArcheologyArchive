<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kelola Lokasi</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
    <nav><a href="dashboard.html">Kembali</a></nav>
    <main>
        <h1>Manajemen Lokasi</h1>
        <div style="display:flex; gap:15px;">
            <div class="col">
                <div class="header-row">
                    <h3>Kota / Kab</h3>
                    <button class="btn-add" id="btn-add-kota-m">+</button>
                </div>
                <div id="kota">Memuat...</div>
            </div>
            <div class="col">
                <div class="header-row">
                    <h3>Kecamatan</h3>
                    <button class="btn-add" id="btn-add-kec-m">+</button>
                </div>
                <div id="kec"><i>Pilih Kota...</i></div>
            </div>
            <div class="col">
                <div class="header-row">
                    <h3>Desa / Kel</h3>
                    <button class="btn-add" id="btn-add-desa-m">+</button>
                </div>
                <div id="desa"><i>Pilih Kecamatan...</i></div>
            </div>
        </div>
    </main>
    <script type="module" src="modules/main.js"></script>
</body>
</html>
