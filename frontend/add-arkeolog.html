<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Tambah Arkeolog</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/components.css"></head>
<body>
    <nav><a href="arkeolog.html">← Kembali</a></nav>
    <main class="form-container">
        <h2>Tambah Arkeolog</h2>
        <form id="form">
            <input type="text" id="nama" required placeholder="Nama Lengkap">
            <input type="text" id="inst" required placeholder="Institusi">
            <input type="text" id="spec" required placeholder="Spesialisasi">
            <input type="email" id="email" required placeholder="Email">
            <input type="text" id="telp" required placeholder="No. Telepon">
            <button type="submit">Simpan</button>
        </form>
    </main>
    <script type="module" src="modules/main.js"></script>
</body>
</html>
